<svg xmlns="http://www.w3.org/2000/svg" width="600" height="760" viewBox="0 0 600 760">
  <filter id="bark" x="0" y="0" width="100%" height="100%">
    <!-- Fréquence basse en Y => fibres verticales d'écorce -->
    <feTurbulence type="fractalNoise" baseFrequency="0.74 0.014" numOctaves="5" seed="11" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="gamma" amplitude="1" exponent="1.6" offset="0"/>
    </feComponentTransfer>
  </filter>
  <rect width="600" height="760" filter="url(#bark)"/>
</svg>
